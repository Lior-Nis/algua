[project]
name = "algua-web"
version = "0.0.1"
description = "Read-only web monitor for algua (backend, slice B)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pywebpush>=2.4.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
